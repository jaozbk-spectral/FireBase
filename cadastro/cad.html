<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=s, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(122, 154, 97);
            color: rgb(0, 0, 0);
        }

        input {

        }

        * {

        #bloco_texto {

        }

        #conteiner_inputs {

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAuVzG6fS7Wmcfq21D6gM3Rvt9l3Zly4KU",
          authDomain: "cadendereco.firebaseapp.com",
          projectId: "cadendereco",
          storageBucket: "cadendereco.firebasestorage.app",
          messagingSenderId: "698396516715",
          appId: "1:698396516715:web:76c6aa8ad1a9d50da6ac2e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("formulario");
        const mensagem = document.getElementById("mensagem");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const CEP = document.getElementById("CEP").value;
            const ENDERECO = document.getElementById("ENDERECO").value;
            const COMPLEMENTO = document.getElementById("COMPLEMENTO").value;
            const CIDADE = document.getElementById("CIDADE").value;
            const TEL1 = document.getElementById("TEL1").value;
            const TEL2 = document.getElementById("TEL2").value;
            const CELULAR = document.getElementById("CELULAR").value;
            const FAX = document.getElementById("FAX").value;
            const BAIRRO = document.getElementById("BAIRRO").value;
            const COMPLE1 = document.getElementById("COMPLE1").value;
            const COMPLE2 = document.getElementById("COMPLE2").value;
            const COMPLE3 = document.getElementById("COMPLE3").value;
            const COMPLE4 = document.getElementById("COMPLE4").value;


            try {
                await addDoc(collection(db, "Endereco"), {
                    CEP,
                    ENDERECO,
                    COMPLEMENTO,
                    CIDADE,
                    TEL1,
                    TEL2,
                    CELULAR,
                    FAX,
                    BAIRRO,
                    COMPLE1,
                    COMPLE2,
                    COMPLE3,
                    COMPLE4
                });

                mensagem.textContent = "Usuário salvo com sucesso.";
                mensagem.style.color = "green";
                form.reset();
            } catch (error) {
                mensagem.textContent = "Erro ao salvar: " + error.message;
                mensagem.style.color = "red";
            }
        });
    </script>
</head>

<body>

            <fieldset>

                                <p>Telefone2: </p>
                                <p>Celular:</p>
                                <p>Fax: </p>
                            </div>
                            <div id="bloco_a">

                                <input type="text" minlength="5" placeholder="80525-000" id="CEP"><br>
                                <input type="text" daminlength="5" placeholder="rua baroxoque 259, cidadao pele" id="ENDERECO"><br>
                                <input type="text" minlength="5" placeholder="bloco de endereço cidadania" id="COMPLEMENTO"> <br>
                                <input type="text" minlength="5" placeholder="bloco de endereço cidadania" id="CIDADE"> <br>

                                <input type="tel" minlength="4" placeholder="+55 41 9557-7696" id="TEL1"> <br>
                                <input type="tel" minlength="4" placeholder="+55 41 9545-7696" id="TEL2"> <br>
                                <input type="tel" minlength="4" placeholder="+55 41 99557-7696" id="CELULAR"> <br>
                                <input type="tel" minlength="4" placeholder="+55 41 7745-7696" id="FAX"><br>
                                <input type="submit" name="tesao" id="submit" value="sim">
                            </div>

                            <div id="bloco_b">
                                <div id="bloco_b1">

                                </div>

                                    Bairro:<input type="text" minlength="3" placeholder="bloco de endereço cidadania" id="BAIRRO">
                                    <button id="lupa">lupa</button><button id="borracha">apagar</button><br>
                                    Complemento: <input type="text" minlength="5" id="COMPLE1"><br>
                                    Complemento: <input type="text" minlength="5" id="COMPLE2"><br>
                                    Complemento: <input type="text" minlength="5" id="COMPLE3"><br>
                                    Complemento: <input type="text" minlength="5" id="COMPLE4"><br>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </form>
        </fieldset>
    </main>
</body>
